<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obsidian-B7000 — B7K Ultra Plugin vs. Pedal A/B Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #c9cdd6;
    --muted: #6b7280;
    --plugin: #3b82f6;
    --pedal: #ef4444;
    --positive: #f59e0b;
    --negative: #6366f1;
    --accent: #818cf8;
    --good: #22c55e;
    --warn: #f59e0b;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 1.5; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; font-weight: 600; color: #e2e8f0; white-space: nowrap; }
  header .status { font-size: 12px; color: var(--muted); }
  header .status.loaded { color: var(--good); }
  header input[type=file] { color: var(--text); font-size: 13px; }
  header input[type=file]::file-selector-button { background: var(--border); color: var(--text); border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; margin-right: 10px; }
  nav { display: flex; gap: 2px; background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; }
  nav button { background: none; border: none; color: var(--muted); padding: 10px 18px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
  nav button:hover { color: var(--text); }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  .tab { display: none; }
  .tab.active { display: block; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin-bottom: 16px; }
  .card h3 { font-size: 14px; margin-bottom: 12px; color: #e2e8f0; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .controls label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .controls select, .controls input { background: var(--border); color: var(--text); border: 1px solid #3a3d4a; padding: 5px 10px; border-radius: 4px; font-size: 13px; }
  .controls .radio-group { display: flex; gap: 4px; }
  .controls .radio-group button { background: var(--border); border: 1px solid #3a3d4a; color: var(--muted); padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .controls .radio-group button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  canvas { max-width: 100%; }
  .heatmap { display: grid; gap: 2px; overflow-x: auto; }
  .hm-cell { padding: 4px 6px; text-align: center; font-size: 10px; font-family: 'SF Mono', 'Fira Code', monospace; border-radius: 2px; min-width: 70px; }
  .hm-header { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; padding: 4px; white-space: nowrap; }
  .hm-row-label { font-size: 11px; color: var(--muted); text-align: right; padding: 4px 8px 4px 0; white-space: nowrap; }
  .hm-rev-divider { grid-column: 1 / -1; height: 1px; background: var(--border); margin: 4px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .quick-take { background: #1e1b2e; border: 1px solid #2d2a3f; border-radius: 6px; padding: 14px 18px; margin-top: 16px; }
  .quick-take h4 { color: var(--accent); margin-bottom: 8px; }
  .quick-take li { margin-bottom: 4px; font-size: 13px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
  .silent-note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .silent-note code { color: var(--warn); }
  .na-cell { color: var(--muted); background: rgba(255,255,255,.02); }
  .blank-slate { text-align: center; padding: 80px 20px; color: var(--muted); }
  .blank-slate p { margin-top: 8px; }
  .harm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 12px; }
  .legend { display: flex; gap: 16px; margin-bottom: 12px; font-size: 12px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>

<header>
  <h1>Obsidian-B7000 (B7K Ultra) — Plugin vs. Pedal A/B Dashboard</h1>
  <div style="display:flex;align-items:center;gap:16px">
    <span class="status" id="status">No data loaded</span>
    <input type="file" id="fileInput" accept=".json">
  </div>
</header>

<nav>
  <button class="active" data-tab="fr">FR Comparison</button>
  <button data-tab="heatmap">FR Error Heatmap</button>
  <button data-tab="thd">THD Comparison</button>
  <button data-tab="harmonics">Harmonic Breakdown</button>
  <button data-tab="summary">Summary</button>
</nav>

<main>
  <div class="blank-slate" id="blankSlate">
    <h2>No data loaded</h2>
    <p>Select <code>analysis/reports/comprehensive_data.json</code> (produced by <code>comprehensive_report.py</code>) using the file picker above to begin.</p>
  </div>

  <div class="tab" id="tab-fr">
    <div class="card">
      <div class="controls">
        <label>Capture: <select id="frCapture"></select></label>
        <label>Sweep level: <span class="radio-group" id="frLevel"></span></label>
      </div>
      <canvas id="frChart" height="400"></canvas>
    </div>
    <div class="card">
      <canvas id="frErrorChart" height="200"></canvas>
    </div>
  </div>

  <div class="tab" id="tab-heatmap">
    <div class="card">
      <div class="controls">
        <label>Sweep level: <span class="radio-group" id="hmLevel"></span></label>
      </div>
      <div class="heatmap" id="heatmapGrid"></div>
    </div>
  </div>

  <div class="tab" id="tab-thd">
    <div class="card">
      <div class="controls">
        <label>Capture: <select id="thdCapture"></select></label>
        <label>Driven level: <span class="radio-group" id="thdLevel"></span></label>
      </div>
      <canvas id="thdChart" height="400"></canvas>
    </div>
  </div>

  <div class="tab" id="tab-harmonics">
    <div class="card">
      <div class="controls">
        <label>Category: <select id="harRev"></select></label>
        <label>Driven level: <span class="radio-group" id="harLevel"></span></label>
        <label>Anchor freq: <span class="radio-group" id="harAnchor"></span></label>
      </div>
      <div class="harm-grid" id="harmGrid"></div>
    </div>
  </div>

  <div class="tab" id="tab-summary">
    <div class="card">
      <h3>Per-Category Summary</h3>
      <table id="summaryTable"></table>
    </div>
    <div class="quick-take" id="quickTake">
      <h4>Quick-Take: Top Issues</h4>
      <ul id="quickTakeList"></ul>
    </div>
  </div>
</main>

<script>
let DATA = null;
let charts = {};

function destroyChartKeys(prefix) {
  Object.keys(charts).filter(k => k.startsWith(prefix)).forEach(k => {
    charts[k]?.destroy();
    delete charts[k];
  });
}

// --- Capture identity / categorisation ---
// The report is a single plugin-vs-pedal shootout (no hardware "revisions" — every
// capture's `rev` field is the literal string "?"), so the meaningful axis for grouping
// and labelling is the capture MATRIX FILE NAME, not `id`/`rev` (both degenerate: most
// `id`s collapse to the same "? D0.50 BL1.00" string across ~30 unrelated captures).
function stripWav(file) {
  return (file || '').replace(/\.wav$/i, '');
}

const CATEGORY_LABELS = {
  ref: 'Reference / Bypass', bypass: 'Reference / Bypass',
  attack: 'Attack', grunt: 'Grunt', blend: 'Blend', drive: 'Drive', level: 'Level',
  master: 'Master', bass: 'Bass (Lo)', treble: 'Treble (Hi)',
  lomid: 'Lo-Mid', lomidfreq: 'Lo-Mid Freq', himid: 'Hi-Mid', himidfreq: 'Hi-Mid Freq'
};

// 'bypass.wav' and 'ref-*.wav' are both the reference/no-effect family and share one
// label above — canonicalise their keys too, or they'd render as two identically-labelled
// rows/dropdown-options that are impossible to tell apart.
const KEY_ALIASES = { bypass: 'ref' };

function categoryOf(file) {
  const first = (file || '').replace(/\.wav$/i, '').split('_')[0];
  const rawKey = first.split('-')[0].toLowerCase();
  const key = KEY_ALIASES[rawKey] || rawKey;
  return { key, label: CATEGORY_LABELS[key] || key.toUpperCase() };
}

// Deterministic hue per category (no fixed palette to maintain as new capture families appear).
function catHue(key) {
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return h % 360;
}

function catBadge(file) {
  const { key, label } = categoryOf(file);
  const hue = catHue(key);
  return `<span class="badge" style="background:hsl(${hue},45%,20%);color:hsl(${hue},70%,72%)">${label}</span>`;
}

// --- Silence-sentinel guard ---
// Zero-knob settings (LEVEL/MASTER fully CCW etc.) render digital silence, and the
// analysis harness represents that as a large negative dB sentinel (observed: plugin_db
// -640, harmonic dB -400) rather than NaN. Left unguarded, a single such capture swamps
// every RMS/max-error/chart scale with a fake ~600 dB "error" and buries the real,
// interesting deviations (see project memory: gap_audit's raw mean over zero-knob
// captures inflates aggregate spread by ~635 dB). Treat anything at/below this floor as
// "no signal" (null), not as data.
const SILENCE_FLOOR_DB = -150;
function cleanDb(v) {
  return (typeof v === 'number' && isFinite(v) && v > SILENCE_FLOOR_DB) ? v : null;
}
function dbDiff(a, b) {
  const ca = cleanDb(a), cb = cleanDb(b);
  return (ca === null || cb === null) ? null : ca - cb;
}

function parseFile() {
  const file = document.getElementById('fileInput').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      DATA = JSON.parse(reader.result);
      document.getElementById('status').textContent = `Loaded: ${DATA.meta.num_captures} captures, ${DATA.meta.num_bands} bands, OS=${DATA.meta.os_factor}x`;
      document.getElementById('status').className = 'status loaded';
      document.getElementById('blankSlate').style.display = 'none';
      populateControls();
      switchTab('fr');
      updateAllViews();
    } catch(e) {
      document.getElementById('status').textContent = 'Parse error: ' + e.message;
    }
  };
  reader.readAsText(file);
}

document.getElementById('fileInput').addEventListener('change', parseFile);

// --- Tab switching ---
function switchTab(name) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + name));
  if (DATA) updateTab(name);
}

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// --- Radio group helper ---
function buildRadio(containerId, options, defaultValue, onChange) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt.label;
    btn.dataset.value = opt.value;
    btn.classList.toggle('active', opt.value === defaultValue);
    btn.addEventListener('click', () => {
      el.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      onChange(opt.value);
    });
    el.appendChild(btn);
  });
  return defaultValue;
}

function getRadioValue(containerId) {
  const active = document.getElementById(containerId).querySelector('button.active');
  return active ? active.dataset.value : null;
}

// --- Populate controls ---
let frCaptureIdx = 0, frSweepLevel = 'sweep_clean';
let hmSweepLevel = 'sweep_clean';
let thdCaptureIdx = 0, thdSweepLevel = 'sweep_drv_-18';
let harRev = 'all', harSweepLevel = 'sweep_drv_-18', harAnchorIdx = 0;

// Group-then-sort capture options by category so e.g. all the "drive-*" sweeps sit
// together instead of being interleaved alphabetically with unrelated files.
function captureOptionsHtml(caps) {
  const groups = new Map();
  caps.forEach((c, i) => {
    const { label } = categoryOf(c.file);
    if (!groups.has(label)) groups.set(label, []);
    groups.get(label).push({ i, text: stripWav(c.file) });
  });
  return [...groups.entries()].sort((a,b) => a[0].localeCompare(b[0])).map(([label, opts]) =>
    `<optgroup label="${label}">` +
    opts.sort((a,b) => a.text.localeCompare(b.text)).map(o => `<option value="${o.i}">${o.text}</option>`).join('') +
    `</optgroup>`
  ).join('');
}

function populateControls() {
  const caps = DATA.captures;
  const levels = DATA.meta.all_sweep_levels;
  const drivenLevels = DATA.meta.driven_sweeps;
  const anchors = DATA.meta.thd_anchors;

  // FR tab
  const frSel = document.getElementById('frCapture');
  frSel.innerHTML = captureOptionsHtml(caps);
  frSel.value = '0';
  frSel.addEventListener('change', () => { frCaptureIdx = +frSel.value; updateFR(); });

  buildRadio('frLevel', levels.map(l => ({label: l.replace('sweep_',''), value: l})), 'sweep_clean', v => { frSweepLevel = v; updateFR(); });

  // Heatmap tab
  buildRadio('hmLevel', levels.map(l => ({label: l.replace('sweep_',''), value: l})), 'sweep_clean', v => { hmSweepLevel = v; updateHeatmap(); });

  // THD tab
  const thdSel = document.getElementById('thdCapture');
  thdSel.innerHTML = captureOptionsHtml(caps);
  thdSel.value = '0';
  thdSel.addEventListener('change', () => { thdCaptureIdx = +thdSel.value; updateTHD(); });

  buildRadio('thdLevel', drivenLevels.map(l => ({label: l.replace('sweep_drv_','drv '), value: l})), 'sweep_drv_-18', v => { thdSweepLevel = v; updateTHD(); });

  // Harmonics tab — categories are derived from the actual filenames on load, not a
  // hardcoded revision list (this project has one plugin build vs. one real pedal, no
  // hardware revisions to compare).
  const cats = [...new Set(caps.map(c => categoryOf(c.file).key))]
    .map(key => ({ key, label: CATEGORY_LABELS[key] || key.toUpperCase() }))
    .sort((a,b) => a.label.localeCompare(b.label));
  const harRevSel = document.getElementById('harRev');
  harRevSel.innerHTML = '<option value="all">All Categories</option>' +
    cats.map(c => `<option value="${c.key}">${c.label}</option>`).join('');
  harRevSel.value = 'all';
  harRev = 'all';
  harRevSel.addEventListener('change', () => { harRev = harRevSel.value; updateHarmonics(); });

  buildRadio('harLevel', drivenLevels.map(l => ({label: l.replace('sweep_drv_','drv '), value: l})), 'sweep_drv_-18', v => { harSweepLevel = v; updateHarmonics(); });

  buildRadio('harAnchor', anchors.map((a,i) => ({label: a + ' Hz', value: ''+i})), '0', v => { harAnchorIdx = +v; updateHarmonics(); });
}

// --- Update per tab ---
function updateTab(name) {
  switch(name) {
    case 'fr': updateFR(); break;
    case 'heatmap': updateHeatmap(); break;
    case 'thd': updateTHD(); break;
    case 'harmonics': updateHarmonics(); break;
    case 'summary': updateSummary(); break;
  }
}

function updateAllViews() {
  updateFR();
  updateHeatmap();
  updateTHD();
  updateHarmonics();
  updateSummary();
}

// === FR Comparison ===
function updateFR() {
  if (!DATA) return;
  destroyChartKeys('fr');
  const c = DATA.captures[frCaptureIdx];
  if (!c) return;
  const bands = DATA.meta.bands;
  const fr = c.fr[frSweepLevel];
  if (!fr) return;
  // null out silence-sentinel bands (see cleanDb) so Chart.js draws a gap instead of
  // auto-scaling the whole axis to a spurious -640 dB reading.
  const plugin = fr.plugin_db.map(cleanDb), pedal = fr.pedal_db.map(cleanDb);
  const diff = plugin.map((v,i) => (v === null || pedal[i] === null) ? null : v - pedal[i]);

  charts.fr = new Chart(document.getElementById('frChart'), {
    type: 'line',
    data: {
      labels: bands,
      datasets: [
        { label: 'Plugin', data: plugin, borderColor: '#3b82f6', backgroundColor: 'transparent', pointRadius: 0, borderWidth: 1.5, tension: 0.3 },
        { label: 'Pedal', data: pedal, borderColor: '#ef4444', backgroundColor: 'transparent', pointRadius: 0, borderWidth: 1.5, tension: 0.3 }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#c9cdd6' } }, tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(2) + ' dB' } } },
      scales: {
        x: { type: 'logarithmic', title: { display: true, text: 'Frequency (Hz)', color: '#6b7280' }, ticks: { color: '#6b7280', maxTicksLimit: 20, callback: v => v >= 1000 ? (v/1000).toFixed(v>=10000?0:1)+'k' : v }, grid: { color: 'rgba(255,255,255,0.04)' } },
        y: { title: { display: true, text: 'Magnitude (dB)', color: '#6b7280' }, ticks: { color: '#6b7280' }, grid: { color: 'rgba(255,255,255,0.04)' } }
      }
    }
  });

  charts.frErr = new Chart(document.getElementById('frErrorChart'), {
    type: 'line',
    data: {
      labels: bands,
      datasets: [
        { label: 'Plugin − Pedal (dB)', data: diff, borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.08)', pointRadius: 0, borderWidth: 1.5, fill: true },
        { label: '+3 dB', data: bands.map(() => 3), borderColor: 'rgba(239,68,68,0.4)', borderDash: [5,5], pointRadius: 0, borderWidth: 1 },
        { label: '−3 dB', data: bands.map(() => -3), borderColor: 'rgba(239,68,68,0.4)', borderDash: [5,5], pointRadius: 0, borderWidth: 1 }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#c9cdd6' } } },
      scales: {
        x: { type: 'logarithmic', title: { display: true, text: 'Frequency (Hz)', color: '#6b7280' }, ticks: { color: '#6b7280', maxTicksLimit: 20, callback: v => v >= 1000 ? (v/1000).toFixed(v>=10000?0:1)+'k' : v }, grid: { color: 'rgba(255,255,255,0.04)' } },
        y: { title: { display: true, text: 'Error (dB)', color: '#6b7280' }, ticks: { color: '#6b7280' }, grid: { color: 'rgba(255,255,255,0.04)' } }
      }
    }
  });
}

// === FR Error Heatmap ===
function heatColor(val) {
  const clamp = 6;
  const t = Math.max(-1, Math.min(1, val / clamp));
  if (t < 0) {
    const s = 0.15 + Math.abs(t) * 0.65;
    return `hsl(${220 + t * 40}, ${s*100}%, ${20 + Math.abs(t)*15}%)`;
  } else {
    const s = 0.15 + t * 0.65;
    return `hsl(${t * 6}, ${s*100}%, ${20 + t*15}%)`;
  }
}

function updateHeatmap() {
  if (!DATA) return;
  const bands = DATA.meta.bands;
  const caps = DATA.captures;
  const grid = document.getElementById('heatmapGrid');
  const nCols = caps.length + 1;

  let html = '';
  // Header row
  html += `<div class="hm-header"></div>`;
  caps.forEach(c => {
    const bl = c.settings.blend;
    const blendWarn = bl != null && bl < 0.90 ? ' ⚠' : '';
    html += `<div class="hm-header" title="${stripWav(c.file)}">${catBadge(c.file)} D${(c.settings.drive ?? 0).toFixed(2)}${blendWarn}</div>`;
  });

  // Data rows
  bands.forEach((b, bi) => {
    html += `<div class="hm-row-label">${b >= 1000 ? (b/1000).toFixed(b>=10000?0:1)+'k' : Math.round(b)}</div>`;
    caps.forEach(c => {
      const fr = c.fr[hmSweepLevel];
      if (!fr) { html += '<div class="hm-cell na-cell">—</div>'; return; }
      const diff = dbDiff(fr.plugin_db[bi], fr.pedal_db[bi]);
      if (diff === null || isNaN(diff)) { html += '<div class="hm-cell na-cell">—</div>'; return; }
      const bg = heatColor(diff);
      const fg = Math.abs(diff) > 3 ? '#fff' : '#c9cdd6';
      html += `<div class="hm-cell" style="background:${bg};color:${fg}">${diff >= 0 ? '+' : ''}${diff.toFixed(1)}</div>`;
    });
  });

  grid.style.gridTemplateColumns = `minmax(50px, auto) repeat(${caps.length}, 1fr)`;
  grid.innerHTML = html;
}

// === THD Comparison ===
function updateTHD() {
  if (!DATA) return;
  destroyChartKeys('thd');
  const c = DATA.captures[thdCaptureIdx];
  if (!c) return;
  const bands = DATA.meta.bands;
  const thd = c.thd[thdSweepLevel];
  if (!thd) return;

  const labels = [];
  const pluginData = [];
  const pedalData = [];
  const naLabels = [];
  const naPlugin = [];
  const naPedal = [];

  bands.forEach((b, i) => {
    const src = thd.source[i];
    if (src === 'na') {
      naLabels.push(b >= 1000 ? (b/1000).toFixed(b>=10000?0:1)+'k' : Math.round(b));
      naPlugin.push(0);
      naPedal.push(0);
    } else {
      labels.push(b >= 1000 ? (b/1000).toFixed(b>=10000?0:1)+'k' : Math.round(b));
      pluginData.push(thd.plugin_pct[i] ?? 0);
      pedalData.push(thd.pedal_pct[i] ?? 0);
    }
  });

  const datasets = [
    { label: 'Plugin THD%', data: pluginData, backgroundColor: 'rgba(59,130,246,0.7)', borderColor: '#3b82f6', borderWidth: 1 },
    { label: 'Pedal THD%', data: pedalData, backgroundColor: 'rgba(239,68,68,0.7)', borderColor: '#ef4444', borderWidth: 1 }
  ];
  if (naLabels.length) {
    datasets.push({ label: 'N/A (no data)', data: naPlugin.map(() => 0), backgroundColor: 'rgba(255,255,255,0.04)', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1 });
  }

  const allLabels = labels.concat(naLabels.map(l => l + ' ⚠'));

  charts.thd = new Chart(document.getElementById('thdChart'), {
    type: 'bar',
    data: { labels: allLabels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#c9cdd6' } }, tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + (ctx.parsed.y ?? 0).toFixed(1) + '%' } } },
      scales: {
        x: { ticks: { color: '#6b7280', maxRotation: 60, font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
        y: { title: { display: true, text: 'THD %', color: '#6b7280' }, ticks: { color: '#6b7280' }, grid: { color: 'rgba(255,255,255,0.04)' } }
      }
    }
  });
}

// === Harmonic Breakdown ===

function updateHarmonics() {
  if (!DATA) return;
  const caps = harRev === 'all' ? DATA.captures : DATA.captures.filter(c => categoryOf(c.file).key === harRev);
  const grid = document.getElementById('harmGrid');
  grid.innerHTML = '';

  destroyChartKeys('har_');

  caps.forEach((c, ci) => {
    const har = c.harmonics[harSweepLevel];
    if (!har) return;

    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<h3>${catBadge(c.file)} ${stripWav(c.file)}</h3><canvas id="harCanvas${ci}" height="250"></canvas>`;
    grid.appendChild(div);

    const ctx = document.getElementById('harCanvas' + ci).getContext('2d');
    const orders = DATA.meta.harmonic_orders;
    const ai = harAnchorIdx;

    const pluginVals = orders.map(o => {
      const key = 'H' + o;
      return har[key] ? cleanDb(har[key].plugin_db[ai]) : null;
    });
    const pedalVals = orders.map(o => {
      const key = 'H' + o;
      return har[key] ? cleanDb(har[key].pedal_db[ai]) : null;
    });

    charts['har_' + ci] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: orders.map(o => 'H' + o),
        datasets: [
          { label: 'Plugin', data: pluginVals, backgroundColor: 'rgba(59,130,246,0.8)', borderColor: '#3b82f6', borderWidth: 1 },
          { label: 'Pedal', data: pedalVals, backgroundColor: 'rgba(239,68,68,0.7)', borderColor: '#ef4444', borderWidth: 1 }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: '#c9cdd6', font: { size: 10 }, usePointStyle: true, pointStyleWidth: 8 } },
          tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + (ctx.parsed.y ?? 0).toFixed(1) + ' dB' } }
        },
        scales: {
          x: { ticks: { color: '#6b7280' }, grid: { color: 'rgba(255,255,255,0.04)' } },
          y: { title: { display: true, text: 'dB re fundamental', color: '#6b7280' }, ticks: { color: '#6b7280' }, grid: { color: 'rgba(255,255,255,0.04)' }, min: -80, max: 0 }
        }
      }
    });
  });
}

// === Summary ===
// NOTE: DATA.summary.by_revision is a template holdover from a multi-hardware-revision
// pedal — this project has exactly one plugin build vs. one real pedal, so every capture's
// `rev` is the literal string "?" and the JSON's own single "?" row is not useful (it's
// also polluted by the same silence-sentinel issue cleanDb() guards against below — its
// fr_rms_max is a ~600 dB artifact from a zero-knob capture, not a real deviation). Compute
// a per-CATEGORY breakdown client-side instead, using the same silence-floor guard as the
// FR/heatmap tabs, and call out which captures were excluded so the gap isn't silent.
function frRmsForCapture(c, bands) {
  const fr = c.fr['sweep_clean'];
  if (!fr) return null;
  let sumSq = 0, n = 0, silentBands = 0;
  bands.forEach((b, i) => {
    const d = dbDiff(fr.plugin_db[i], fr.pedal_db[i]);
    if (d === null) { silentBands++; return; }
    sumSq += d * d;
    n++;
  });
  // Require most of the band set to carry real signal, else this capture's "FR" is really
  // just measuring the sentinel guard, not the plugin — exclude rather than report ~0.
  if (n < bands.length * 0.5) return { rms: null, silentBands };
  return { rms: Math.sqrt(sumSq / n), silentBands };
}

function updateSummary() {
  if (!DATA) return;
  const caps = DATA.captures;
  const bands = DATA.meta.bands;
  const table = document.getElementById('summaryTable');

  const perCapture = caps.map(c => ({ c, ...frRmsForCapture(c, bands) }));
  const excluded = perCapture.filter(r => r.rms === null);
  const scored = perCapture.filter(r => r.rms !== null);

  const byCat = new Map();
  scored.forEach(r => {
    const { key, label } = categoryOf(r.c.file);
    if (!byCat.has(key)) byCat.set(key, { label, rows: [] });
    byCat.get(key).rows.push(r);
  });

  const median = arr => {
    const s = [...arr].sort((a,b) => a-b);
    const mid = Math.floor(s.length / 2);
    return s.length % 2 ? s[mid] : (s[mid-1] + s[mid]) / 2;
  };

  let html = '<thead><tr><th>Category</th><th>Captures</th><th>FR RMS Mean</th><th>FR RMS Median</th><th>FR RMS Min</th><th>FR RMS Max</th><th>Best</th><th>Worst</th></tr></thead><tbody>';

  const overallRms = scored.map(r => r.rms);
  html += `<tr style="font-weight:600">
    <td>All captures (valid FR)</td>
    <td>${scored.length}${excluded.length ? ` <span class="na-cell" style="padding:1px 5px;border-radius:3px">+${excluded.length} excluded</span>` : ''}</td>
    <td>${(overallRms.reduce((a,b)=>a+b,0)/overallRms.length).toFixed(2)} dB</td>
    <td>${median(overallRms).toFixed(2)} dB</td>
    <td>${Math.min(...overallRms).toFixed(2)} dB</td>
    <td>${Math.max(...overallRms).toFixed(2)} dB</td>
    <td colspan="2"></td>
  </tr>`;

  [...byCat.entries()].sort((a,b) => a[1].label.localeCompare(b[1].label)).forEach(([key, group]) => {
    const rmsVals = group.rows.map(r => r.rms);
    const best = group.rows.reduce((a,b) => a.rms < b.rms ? a : b);
    const worst = group.rows.reduce((a,b) => a.rms > b.rms ? a : b);
    html += `<tr>
      <td>${catBadge(group.rows[0].c.file)}</td>
      <td>${group.rows.length}</td>
      <td>${(rmsVals.reduce((a,b)=>a+b,0)/rmsVals.length).toFixed(2)} dB</td>
      <td>${median(rmsVals).toFixed(2)} dB</td>
      <td>${Math.min(...rmsVals).toFixed(2)} dB</td>
      <td>${Math.max(...rmsVals).toFixed(2)} dB</td>
      <td>${stripWav(best.c.file)}</td>
      <td>${stripWav(worst.c.file)}</td>
    </tr>`;
  });
  html += '</tbody>';
  table.innerHTML = html;

  const silentNote = document.getElementById('silentNote') || (() => {
    const p = document.createElement('p');
    p.id = 'silentNote';
    p.className = 'silent-note';
    document.getElementById('summaryTable').closest('.card').appendChild(p);
    return p;
  })();
  silentNote.innerHTML = excluded.length
    ? `Excluded from FR RMS (mostly/fully digital silence at this knob setting — e.g. LEVEL/MASTER fully CCW — where the harness reports a sentinel dB floor rather than real signal): ` +
      excluded.map(r => `<code>${stripWav(r.c.file)}</code>`).join(', ')
    : '';

  // Quick-take: scan for real FR issues, silence-guarded so a zero-knob capture can't
  // masquerade as a ~600 dB "error" and bury the genuine deviations underneath it.
  const issues = [];

  caps.forEach(c => {
    const fr = c.fr['sweep_clean'];
    if (!fr) return;
    let hfError = 0, count = 0;
    bands.forEach((b, i) => {
      if (b >= 8000) {
        const d = dbDiff(fr.plugin_db[i], fr.pedal_db[i]);
        if (d === null) return;
        hfError += Math.abs(d);
        count++;
      }
    });
    if (count) {
      const avg = hfError / count;
      if (avg > 6) issues.push({ file: c.file, issue: `HF (≥8kHz) avg error ${avg.toFixed(1)} dB`, severity: 'high' });
      else if (avg > 3) issues.push({ file: c.file, issue: `HF (≥8kHz) avg error ${avg.toFixed(1)} dB`, severity: 'med' });
    }
    // Check max error
    let maxErr = 0, maxBand = 0;
    bands.forEach((b, i) => {
      const d = dbDiff(fr.plugin_db[i], fr.pedal_db[i]);
      if (d === null) return;
      const e = Math.abs(d);
      if (e > maxErr) { maxErr = e; maxBand = b; }
    });
    if (maxErr > 10) issues.push({ file: c.file, issue: `Max error ${maxErr.toFixed(1)} dB at ${Math.round(maxBand)} Hz`, severity: 'high' });
  });

  // Sort by severity then error
  issues.sort((a,b) => (b.severity === 'high' ? 1 : 0) - (a.severity === 'high' ? 1 : 0));
  const topIssues = issues.slice(0, 8);

  const qtList = document.getElementById('quickTakeList');
  qtList.innerHTML = topIssues.map(i =>
    `<li>${catBadge(i.file)} ${stripWav(i.file)}: ${i.issue} ${i.severity === 'high' ? '⚠' : ''}</li>`
  ).join('');
  if (!topIssues.length) qtList.innerHTML = '<li>No major issues detected across captures.</li>';
}
</script>
